# Weekly update pull requests for every pinned dependency; CI must pass (including the image scan) before merging.
# The cooldown skips releases younger than a week, so a compromised release is usually caught before it is offered.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      maven-minor-and-patch:
        update-types: [minor, patch]

  # Base images are pinned by digest; this keeps the digests (and their OS patches) current.
  - package-ecosystem: docker
    directories:
      - /booking-producer-service
      - /booking-consumer-service
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
    # The build JDK must match the Java 21 runtime image and CI; a new Java major is a deliberate, project-wide change.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Local MongoDB and RabbitMQ track the production majors (Atlas 8.0, the cluster's RabbitMQ 4.4); those upgrade
    # deliberately, together with production.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directory: /terraform
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
