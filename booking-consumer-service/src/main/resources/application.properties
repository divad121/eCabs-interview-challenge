spring.application.name=booking-consumer-service

# Defaults are for a local, credential-less setup only. Every property is overridable at runtime via
# environment variables (e.g. SPRING_RABBITMQ_HOST, SPRING_MONGODB_URI) or via files in the
# secrets directory (file name = property name), so no image rebuild is needed for config or secrets.
spring.config.import=optional:configtree:/etc/ecabs/secrets/

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.listener.simple.default-requeue-rejected=false

spring.mongodb.uri=mongodb://localhost:27017/ecabs

# The consumer has no API; its web server only serves the actuator endpoints
server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Readiness gates rollouts: a new pod only replaces an old one once it can reach the broker and database
management.endpoint.health.group.readiness.include=readinessState,rabbit,mongo
