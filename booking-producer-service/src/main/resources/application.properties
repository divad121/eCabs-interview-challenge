spring.application.name=booking-producer-service

# Defaults are for a local, credential-less setup only. Every property is overridable at runtime via
# environment variables (e.g. SPRING_RABBITMQ_HOST, SPRING_RABBITMQ_PASSWORD) or via files in the
# secrets directory (file name = property name), so no image rebuild is needed for config or secrets.
spring.config.import=optional:configtree:/etc/ecabs/secrets/

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
# A booking is only acknowledged (202) after the broker confirms it stored the event
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
booking.publish.confirm-timeout=5s

spring.jackson.default-property-inclusion=non_null

# Actuator on a separate port, so it is never reachable through the public API port
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Liveness never checks dependencies (restarts do not fix a broker outage); readiness sheds traffic
# from pods that cannot publish
management.endpoint.health.group.readiness.include=readinessState,rabbit

# API docs are opt-in (enabled for local runs only)
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
